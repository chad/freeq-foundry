name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version pin here: the action reads packageManager from package.json,
      # and specifying both is an error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: package exports resolve to dist, so typecheck and test both
      # depend on it. Running typecheck first fails with a misleading
      # "cannot find module" that hides the real ordering problem.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test

  spec-links:
    name: specification anchors resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every docs link into the specification
        run: python3 scripts/check-spec-links.py
